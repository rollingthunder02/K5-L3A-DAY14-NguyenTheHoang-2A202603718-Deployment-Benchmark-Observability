services:
  - type: web
    name: k5-day14-hoang-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: k5-day14-hoang-redis
          property: connectionString

  - type: keyvalue
    name: k5-day14-hoang-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
